name: Refresh playlist

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours: one check, then exit
  workflow_dispatch:
    inputs:
      minutes:
        description: "Keep polling for this many minutes (0 = check once). Max 350."
        default: "0"
      interval:
        description: "Seconds between checks while polling"
        default: "120"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet yt-dlp
      - name: Poll the playlist and commit when it changes
        env:
          MINUTES: ${{ github.event.inputs.minutes || '0' }}
          INTERVAL: ${{ github.event.inputs.interval || '120' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + MINUTES * 60 ))
          while :; do
            git pull -q --rebase origin main || true   # pick up site edits pushed meanwhile
            if python3 scripts/fetch_playlist.py; then
              if git diff --quiet; then
                echo "$(date -u +%H:%M:%S) no change"
              else
                git commit -qam "Refresh playlist from YouTube"
                git push -q origin HEAD:main && echo "$(date -u +%H:%M:%S) pushed update" || { echo "push failed, retrying next round"; git reset -q --hard origin/main; }
              fi
            else
              echo "$(date -u +%H:%M:%S) fetch failed, will retry"
              git checkout -q -- . || true
            fi
            [ "$(date +%s)" -ge "$end" ] && break
            sleep "$INTERVAL"
          done
